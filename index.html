<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prioritizer & Tracker Web App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24 font-sans">

  <header class="sticky top-0 z-50 bg-slate-800/90 backdrop-blur-md border-b border-slate-700 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <i data-lucide="activity" class="w-6 h-6 text-indigo-400"></i>
      <h1 class="font-bold text-lg text-white">Prioritizer & Tracker</h1>
    </div>
    <span id="live-date" class="text-xs font-mono bg-slate-900 px-2.5 py-1 rounded border border-slate-700 text-indigo-300"></span>
  </header>

  <main class="max-w-7xl mx-auto p-4 space-y-6">

    <!-- TAB 1: DASHBOARD -->
    <section id="tab-dashboard" class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold flex items-center gap-2 text-indigo-400"><i data-lucide="layout-dashboard"></i> Dashboard</h2>
        <span class="text-xs text-slate-400">Edit dues & descriptions directly on cards</span>
      </div>
      <div id="dashboard-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </section>

    <!-- TAB 2: MY PRIORITIZER (2026 CALENDAR WITH NAVIGATOR) -->
    <section id="tab-prioritizer" class="space-y-4 hidden">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-slate-800 p-3 rounded-xl border border-slate-700">
        <h2 class="text-lg font-bold flex items-center gap-2 text-indigo-400"><i data-lucide="calendar"></i> 2026 Calendar Prioritizer</h2>
        
        <!-- Month / View Navigator -->
        <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
          <button onclick="navigateMonth(-1)" class="p-1.5 bg-slate-700 hover:bg-slate-600 rounded text-slate-200"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
          <select id="month-picker" onchange="changeMonth(this.value)" class="bg-slate-900 border border-slate-700 rounded px-3 py-1 text-xs text-indigo-300 font-semibold focus:outline-none">
            <option value="0">January 2026</option>
            <option value="1">February 2026</option>
            <option value="2">March 2026</option>
            <option value="3">April 2026</option>
            <option value="4">May 2026</option>
            <option value="5">June 2026</option>
            <option value="6">July 2026</option>
            <option value="7">August 2026</option>
            <option value="8">September 2026</option>
            <option value="9">October 2026</option>
            <option value="10">November 2026</option>
            <option value="11">December 2026</option>
          </select>
          <button onclick="navigateMonth(1)" class="p-1.5 bg-slate-700 hover:bg-slate-600 rounded text-slate-200"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        </div>
      </div>

      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-xl overflow-x-auto max-h-[600px]">
        <table class="w-full text-xs text-left whitespace-nowrap">
          <thead class="bg-slate-900/90 text-slate-300 sticky top-0 z-10">
            <tr id="pri-grid-header"></tr>
          </thead>
          <tbody id="pri-grid-body" class="divide-y divide-slate-700"></tbody>
          <tfoot class="bg-slate-900/90 font-bold border-t border-slate-600 sticky bottom-0">
            <tr id="pri-grid-footer"></tr>
          </tfoot>
        </table>
      </div>
    </section>

    <!-- TAB 3: SOURCES MATRIX -->
    <section id="tab-sources" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold flex items-center gap-2 text-indigo-400"><i data-lucide="users"></i> Sources Matrix</h2>
        <span class="text-xs text-slate-400">Editable sources, tasks, and dues</span>
      </div>

      <!-- Sources Summary Table -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-xl overflow-x-auto">
        <h3 class="text-xs font-bold uppercase text-slate-400 mb-3">Sources Due & Progress Summary</h3>
        <table class="w-full text-xs text-left">
          <thead class="border-b border-slate-700 text-slate-400 uppercase">
            <tr>
              <th class="py-2 px-3">Source Name</th>
              <th class="py-2 px-3 text-center">Overall Done</th>
              <th class="py-2 px-3 text-center">Editable Due</th>
              <th class="py-2 px-3 text-center">Current Pace</th>
              <th class="py-2 px-3 text-center">Target Alignment</th>
              <th class="py-2 px-3 text-center">Daily Target</th>
            </tr>
          </thead>
          <tbody id="sources-summary-body" class="divide-y divide-slate-700"></tbody>
        </table>
      </div>

      <!-- Matrix Cell Inputs -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-xl overflow-x-auto space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold uppercase text-slate-400">Task vs Source Counts Matrix</h3>
        </div>
        <table class="w-full text-xs text-left whitespace-nowrap">
          <thead class="bg-slate-900/80 text-slate-300">
            <tr id="src-grid-header"></tr>
          </thead>
          <tbody id="src-grid-body" class="divide-y divide-slate-700"></tbody>
        </table>

        <!-- Add Dynamic Row Buttons per Pace Group -->
        <div class="flex flex-wrap gap-2 pt-3 border-t border-slate-700">
          <button onclick="addNewTaskRow('pace1')" class="px-3 py-1.5 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 rounded border border-indigo-500/40 text-xs font-semibold flex items-center gap-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Row (Pace 1)</button>
          <button onclick="addNewTaskRow('pace2')" class="px-3 py-1.5 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 rounded border border-indigo-500/40 text-xs font-semibold flex items-center gap-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Row (Pace 2)</button>
          <button onclick="addNewTaskRow('pace4')" class="px-3 py-1.5 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 rounded border border-indigo-500/40 text-xs font-semibold flex items-center gap-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Row (Pace 4)</button>
          <button onclick="addNewTaskRow('pace5')" class="px-3 py-1.5 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 rounded border border-indigo-500/40 text-xs font-semibold flex items-center gap-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Row (Pace 5)</button>
        </div>
      </div>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur-md border-t border-slate-700 py-2.5 px-6 flex justify-around items-center z-50">
    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center text-indigo-400 text-xs">
      <i data-lucide="layout-dashboard" class="w-5 h-5 mb-1"></i> Dashboard
    </button>
    <button onclick="switchTab('prioritizer')" id="nav-prioritizer" class="flex flex-col items-center text-slate-400 text-xs">
      <i data-lucide="calendar" class="w-5 h-5 mb-1"></i> Prioritizer Matrix
    </button>
    <button onclick="switchTab('sources')" id="nav-sources" class="flex flex-col items-center text-slate-400 text-xs">
      <i data-lucide="users" class="w-5 h-5 mb-1"></i> Sources Matrix
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
